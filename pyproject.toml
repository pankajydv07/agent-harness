[project]
name = "myagent"
version = "0.1.0"
description = "A minimal coding agent harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.5.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "questionary>=2.1.0",
    "prompt-toolkit>=3.0.43",
]

[project.scripts]
my-agent = "myagent.agent:main"
myagent = "myagent.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myagent"]
